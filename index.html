<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Download statistics for Apklis developers: totals, trends and a per-app breakdown, from your developer console account." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Apklis Stats</title>
    <!-- Apply the saved theme before the first paint to avoid a flash. -->
    <script>
      (function () {
        var preference = 'system'
        try { preference = localStorage.getItem('apklis-stats.theme') || 'system' } catch (e) {}
        var dark = preference === 'dark' ||
          (preference !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
